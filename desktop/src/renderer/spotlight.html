<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>Nex Spotlight</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,sans-serif;color:#f3f1ed;overflow:hidden}
  .spot{background:rgba(24,24,28,.94);border:1px solid rgba(217,119,87,.45);border-radius:18px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;height:100vh}
  .row{display:flex;align-items:center;gap:8px}.badge{font-weight:700;color:#d97757;font-size:13px;letter-spacing:.03em;user-select:none}
  input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:10px 12px;font-size:14px;outline:none}input:focus{border-color:#d97757}
  button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:13px}
  button.primary{background:#d97757;border-color:#d97757;font-weight:600}button.active{border-color:#d97757;color:#f2a286}
  .hint{font-size:11.5px;color:#9ea3b0;display:flex;justify-content:space-between}
  .reply{flex:1;overflow-y:auto;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;white-space:pre-wrap}
</style></head><body>
<div class="spot"><div class="row"><span class="badge">NEX</span>
<input id="spotInput" type="text" placeholder="Спроси Некса или дай команду… (Enter — отправить, Esc — скрыть)" autofocus />
<button id="btnSpotScreen" title="Посмотри на экран">👁</button><button id="btnSpotSend" class="primary">↑</button><button id="btnSpotOpen" title="Открыть основное окно">↗</button></div>
<div class="hint"><span id="spotStatus">Alt+Space · Быстрая строка Nex</span><span>Esc — закрыть</span></div>
<div class="reply" id="spotReply" hidden></div></div><script src="spotlight.js"></script></body></html>
