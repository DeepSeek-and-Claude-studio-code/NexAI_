<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Nex Companion</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden; user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 10px; box-sizing: border-box; gap: 6px;
  }
  .bubble {
    background: rgba(22, 24, 29, 0.90);
    color: #eceef2;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12px;
    max-width: 210px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    backdrop-filter: blur(8px);
    transition: opacity .2s ease;
  }
  .bubble.empty { opacity: 0; pointer-events: none; }
  canvas {
    width: 168px; height: 168px;
    cursor: grab;
    display: block;
  }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bubble" id="bubble">Готов к работе</div>
  <canvas id="cv" width="336" height="336"></canvas>
</div>
<script src="sphere.js"></script>
<script src="companion.js"></script>
</body>
</html>
