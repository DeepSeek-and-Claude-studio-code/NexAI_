name: Build Desktop (Windows & Linux)

on:
  push:
    branches: [main, master]
    paths: ['desktop/**', '.github/workflows/build-desktop.yml']
  pull_request:
    paths: ['desktop/**']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: nex-desktop-windows
          path: desktop/dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rpmbuild for Fedora RPM packaging
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm install

      - name: Build Linux RPM (Fedora), AppImage & DEB
        run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: nex-desktop-linux
          path: |
            desktop/dist/*.rpm
            desktop/dist/*.AppImage
            desktop/dist/*.deb
